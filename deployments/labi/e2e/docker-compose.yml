# Labi modification: disposable Plane stack for the browser E2E gate (CI only). See LABI-CHANGES.md.
# Mirrors deployments/cli/community/docker-compose.yml; our images for web/live/backend, official for the rest.
# Every secret comes from the .env generated at runtime by run.sh (never committed).

x-db-env: &db-env
  PGHOST: plane-db
  PGDATABASE: plane
  POSTGRES_USER: plane
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
  POSTGRES_DB: plane
  POSTGRES_PORT: 5432
  PGDATA: /var/lib/postgresql/data

x-redis-env: &redis-env
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: redis://plane-redis:6379/

x-aws-s3-env: &aws-s3-env
  AWS_REGION: ""
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?}
  AWS_S3_ENDPOINT_URL: http://plane-minio:9000
  AWS_S3_BUCKET_NAME: uploads

x-proxy-env: &proxy-env
  APP_DOMAIN: localhost
  FILE_SIZE_LIMIT: 10485760
  CERT_EMAIL: ""
  LISTEN_HTTP_PORT: 80
  BUCKET_NAME: uploads
  SITE_ADDRESS: ":80"

x-app-env: &app-env
  WEB_URL: http://localhost
  DEBUG: 0
  CORS_ALLOWED_ORIGINS: http://localhost
  GUNICORN_WORKERS: 2
  USE_MINIO: 1
  DATABASE_URL: postgresql://plane:${POSTGRES_PASSWORD}@plane-db/plane
  SECRET_KEY: ${SECRET_KEY:?}
  AMQP_URL: amqp://plane:${RABBITMQ_PASSWORD}@plane-mq:5672/plane
  MINIO_ENDPOINT_SSL: 0
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:?}
  # Five UI logins in a row from one IP: the default 10/minute would throttle the suite.
  AUTHENTICATION_RATE_LIMIT: 200/minute

x-backend: &backend
  image: ${LABI_IMAGE_PREFIX:?}-backend:${LABI_TAG:?}
  restart: unless-stopped
  environment:
    <<: [*app-env, *db-env, *redis-env, *aws-s3-env, *proxy-env]

services:
  web:
    image: ${LABI_IMAGE_PREFIX}-frontend:${LABI_TAG}
    restart: unless-stopped
    depends_on: [api]

  space:
    image: makeplane/plane-space:v1.4.3
    restart: unless-stopped
    depends_on: [api]

  admin:
    image: makeplane/plane-admin:v1.4.3
    restart: unless-stopped
    depends_on: [api]

  live:
    image: ${LABI_IMAGE_PREFIX}-live:${LABI_TAG}
    restart: unless-stopped
    environment:
      <<: *redis-env
      API_BASE_URL: http://api:8000
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost
    depends_on: [api]

  migrator:
    <<: *backend
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    depends_on: [plane-db, plane-redis]

  api:
    <<: *backend
    command: ./bin/docker-entrypoint-api.sh
    depends_on:
      migrator: { condition: service_completed_successfully }
      plane-mq: { condition: service_started }
      plane-minio: { condition: service_started }

  worker:
    <<: *backend
    command: ./bin/docker-entrypoint-worker.sh
    depends_on: [api]

  beat-worker:
    <<: *backend
    command: ./bin/docker-entrypoint-beat.sh
    depends_on: [api]

  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: postgres -c 'max_connections=1000'
    environment: *db-env
    volumes: [pgdata:/var/lib/postgresql/data]

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: plane
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
      RABBITMQ_DEFAULT_VHOST: plane

  plane-minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    restart: unless-stopped
    command: server /export --console-address ":9090"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    volumes: [uploads:/export]

  proxy:
    image: makeplane/plane-proxy:v1.4.3
    restart: unless-stopped
    environment: *proxy-env
    ports: ["80:80"]
    depends_on: [web, api, space, admin, live]

volumes:
  pgdata:
  uploads:
