# Labi modification: CI/CD for the Agência Labi deployment of this AGPL fork. See LABI-CHANGES.md.
# Push to `labi` => tests + secret scan => images on GHCR (tagged with the exact commit) => deploy.
# Pull requests only run the checks (no secrets are exposed to PRs from forks).
name: Labi CI/CD

on:
  push:
    branches: [labi]
  pull_request:
    branches: [labi]
  workflow_dispatch:
    inputs:
      image_sha:
        description: "QA only: reuse the images built for this commit SHA (skips checks + build). Empty = full run."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: labi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API (lint + migrations + tests)
    if: ${{ !inputs.image_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15.7-alpine
        env:
          POSTGRES_USER: plane
          POSTGRES_PASSWORD: plane
          POSTGRES_DB: plane
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plane" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: plane.settings.test
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgresql://plane:plane@127.0.0.1:5432/plane
      REDIS_URL: redis://127.0.0.1:6379/
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/*.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
      - run: pip install -r requirements/test.txt ruff
      - name: Ruff (Labi code)
        run: |
          ruff check plane/messaging plane/tests/contract/app/test_labi_messaging.py
          ruff format --check plane/messaging plane/tests/contract/app/test_labi_messaging.py
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Contract tests (team chat)
        run: python -m pytest plane/tests/contract/app/test_labi_messaging.py -q -p no:cacheprovider

  web-live:
    name: Web + Live (types + lint)
    if: ${{ !inputs.image_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - run: corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run check:types check:lint --filter=web --filter=live

  secrets:
    name: Secret scan (Labi commits)
    if: ${{ !inputs.image_sha }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: gitleaks on commits after upstream v1.4.3
        run: |
          git fetch --no-tags origin "refs/tags/v1.4.3:refs/tags/v1.4.3" || true
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.18.4 \
            detect --source /repo --log-opts="v1.4.3..HEAD" --redact --no-banner -v

  images:
    name: Build images
    # labi pushes, or manual runs on any branch (QA iterations); only labi moves the :labi tag.
    if: ${{ !inputs.image_sha && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/labi')) }}
    needs: [api, web-live, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: frontend
            context: .
            file: apps/web/Dockerfile.web
          - name: live
            context: .
            file: apps/live/Dockerfile.live
          - name: backend
            context: apps/api
            file: apps/api/Dockerfile.api
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: |
            VITE_LABI_SOURCE_URL=https://github.com/${{ github.repository }}/tree/${{ github.sha }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/plane-labi-${{ matrix.name }}:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/labi' && format('ghcr.io/{0}/plane-labi-{1}:labi', github.repository_owner, matrix.name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  e2e:
    name: E2E (browser QA gate)
    needs: [images]
    # Normally after this commit's images; on a QA dispatch with image_sha, against those existing images.
    if: ${{ !cancelled() && (needs.images.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_sha != '' && needs.images.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run E2E against the images of this commit
        env:
          LABI_IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/plane-labi
          LABI_TAG: sha-${{ inputs.image_sha || github.sha }}
        run: bash deployments/labi/e2e/run.sh
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-evidence
          path: deployments/labi/e2e/artifacts/
          retention-days: 14

  deploy:
    name: Deploy (production)
    if: github.event_name == 'push' && github.ref == 'refs/heads/labi'
    needs: [images, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Deploy over restricted SSH key
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is pinned server-side to a forced command; this string is only its argument.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "root@${DEPLOY_HOST}" "deploy sha-${GITHUB_SHA}"
      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/deploy
